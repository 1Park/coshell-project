name: Deploy to local Mac
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coshell-local-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, coshell-local]
    timeout-minutes: 15
    env:
      REPO_PATH: ${{ vars.COSHELL_REPO_PATH }}
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Update main and deploy
        shell: bash
        env:
          DEPLOY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/share/coshell/runtime/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          cd "${REPO_PATH:?Set COSHELL_REPO_PATH repository variable}"
          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain)"
          # Use the job's read-only token instead of an interactive macOS keychain prompt.
          auth="$(printf 'x-access-token:%s' "$DEPLOY_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=2 \
          GIT_CONFIG_KEY_0=credential.helper GIT_CONFIG_VALUE_0='' \
          GIT_CONFIG_KEY_1=http.https://github.com/.extraheader GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $auth" \
            git pull --ff-only origin main
          unset auth DEPLOY_TOKEN
          bash scripts/deploy-local.sh
